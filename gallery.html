    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --nv-accent: #d4af37; /* Nova Gold */
            --nv-ink: #000000; /* Pure Black */
            --nv-surface: #1a1a1a; /* Near-Black Grey */
            --nv-radius: 8px;
        }

        body {
            background-color: var(--nv-ink);
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem 0;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: transform 0.3s ease;
            height: 400px;
            width: 100%;
            background: var(--nv-surface);
            /* Ensure no blue/navy tints from image bleed or borders */
            box-shadow: 0 0 15px rgba(0,0,0,1);
            filter: contrast(1.1) brightness(1.1);
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            border-color: var(--nv-accent);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .gallery-item .caption {
            padding: 1rem;
            background: var(--nv-surface);
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            font-size: 0.9rem;
            text-align: center;
        }

        .gradient-text {
            background: linear-gradient(90deg, #d4af37, #f9e076);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-title {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

    </style>
</head>
